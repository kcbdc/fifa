name: ERGM and TERGM Analysis (fast, container-based)

# v30: analyze.yml의 대안 버전입니다. build-r-image.yml로 미리 빌드해둔
# ghcr.io/.../fifa-r-env 이미지를 사용해서 "R 설정"과 "R 패키지 설치" 두 스텝을
# 통째로 생략합니다 — 이미지에 이미 다 설치돼 있기 때문입니다.
#
# ⚠️ 사용 전 필수: Actions 탭에서 "Build R environment image"를 먼저 한 번 수동
# 실행해서 이미지가 ghcr.io에 실제로 존재해야 이 워크플로가 동작합니다.
# 이미지가 없는 상태로 이 워크플로를 트리거하면 컨테이너를 pull하지 못해 즉시 실패합니다.
#
# 검증 방법:
#   1) Actions → Build R environment image → Run workflow (완료까지 대기)
#   2) 이 파일 이름을 analyze.yml로 바꿔치기(기존 analyze.yml은 백업해두고 교체)
#      하거나, Cloudflare Worker의 GITHUB_WORKFLOW_FILE 값을
#      "analyze-fast.yml"로 바꿔서 이 워크플로가 대신 트리거되도록 설정
#   3) [ERGM] 탭에서 "정적 ERGM만(빠름)"으로 한 번 테스트 실행해 정상 완료되는지 확인
#   4) 문제없으면 "정적+시간적 모두"로도 확인
#
# 검증 전까지는 기존 analyze.yml이 계속 기본으로 사용되며 이 파일은 아무 영향도 주지
# 않습니다(파일이 저장소에 있어도 GITHUB_WORKFLOW_FILE이 이 파일명을 가리키지 않으면
# repository_dispatch/workflow_dispatch 트리거 대상이 되지 않습니다).

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "D1 model_runs ID"
        required: true
        default: "1"
      analysis_mode:
        description: "ergm, tergm, or both"
        required: true
        type: choice
        options:
          - both
          - ergm
          - tergm
        default: both
  repository_dispatch:
    types: [run-ergm]

permissions:
  contents: read
  packages: read

jobs:
  report-run:
    runs-on: ubuntu-latest
    env:
      RUN_ID: ${{ github.event.client_payload.run_id || inputs.run_id }}
      ANALYSIS_MODE: ${{ github.event.client_payload.analysis_mode || inputs.analysis_mode || 'both' }}
      API_BASE_URL: ${{ secrets.API_BASE_URL }}
      ANALYSIS_API_TOKEN: ${{ secrets.ANALYSIS_API_TOKEN }}
    steps:
      - name: Report GitHub run ID to API
        shell: bash
        run: |
          curl -sf -X POST "$API_BASE_URL/api/model-github-run" \
            -H "Authorization: Bearer $ANALYSIS_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"run_id\":\"$RUN_ID\",\"github_run_id\":\"${{ github.run_id }}\",\"github_run_url\":\"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            || echo "::warning::GitHub run ID를 API에 보고하지 못했습니다(계속 진행)."

      - name: Validate configuration
        shell: bash
        run: |
          test -n "$RUN_ID" || (echo "RUN_ID is missing" && exit 1)
          test -n "$API_BASE_URL" || (echo "API_BASE_URL secret is missing" && exit 1)
          test -n "$ANALYSIS_API_TOKEN" || (echo "ANALYSIS_API_TOKEN secret is missing" && exit 1)
          echo "Run ID: $RUN_ID"
          echo "Analysis mode: $ANALYSIS_MODE"

  static-ergm:
    needs: report-run
    if: |
      ${{
        (github.event.client_payload.analysis_mode || inputs.analysis_mode || 'both') == 'ergm' ||
        (github.event.client_payload.analysis_mode || inputs.analysis_mode || 'both') == 'both'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    container:
      image: ghcr.io/${{ github.repository_owner }}/fifa-r-env:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      RUN_ID: ${{ github.event.client_payload.run_id || inputs.run_id }}
      API_BASE_URL: ${{ secrets.API_BASE_URL }}
      ANALYSIS_API_TOKEN: ${{ secrets.ANALYSIS_API_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # "Setup R"과 "Install and cache R dependencies" 스텝이 통째로 사라졌습니다 —
      # 컨테이너 이미지에 이미 R과 모든 패키지가 설치돼 있습니다.

      - name: Run static ERGM
        run: Rscript r-analysis/run_ergm.R "$RUN_ID"

      - name: Upload analysis artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: network-model-results-ergm-${{ env.RUN_ID }}
          path: artifacts/
          retention-days: 30

  temporal-tergm:
    needs: report-run
    if: |
      ${{
        (github.event.client_payload.analysis_mode || inputs.analysis_mode || 'both') == 'tergm' ||
        (github.event.client_payload.analysis_mode || inputs.analysis_mode || 'both') == 'both'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    container:
      image: ghcr.io/${{ github.repository_owner }}/fifa-r-env:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      RUN_ID: ${{ github.event.client_payload.run_id || inputs.run_id }}
      API_BASE_URL: ${{ secrets.API_BASE_URL }}
      ANALYSIS_API_TOKEN: ${{ secrets.ANALYSIS_API_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run temporal ERGM
        continue-on-error: true
        run: Rscript r-analysis/run_tergm.R "$RUN_ID"

      - name: Upload analysis artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: network-model-results-tergm-${{ env.RUN_ID }}
          path: artifacts/
          retention-days: 30

  manifest:
    needs: [static-ergm, temporal-tergm]
    if: always()
    runs-on: ubuntu-latest
    env:
      RUN_ID: ${{ github.event.client_payload.run_id || inputs.run_id }}
      ANALYSIS_MODE: ${{ github.event.client_payload.analysis_mode || inputs.analysis_mode || 'both' }}
    steps:
      - name: Write workflow manifest
        shell: bash
        run: |
          mkdir -p artifacts
          cat > artifacts/workflow-manifest.json <<EOF
          {
            "run_id": "$RUN_ID",
            "analysis_mode": "$ANALYSIS_MODE",
            "repository": "${{ github.repository }}",
            "commit": "${{ github.sha }}",
            "workflow_run": "${{ github.run_id }}",
            "image": "ghcr.io/${{ github.repository_owner }}/fifa-r-env:latest",
            "static_ergm_result": "${{ needs.static-ergm.result }}",
            "temporal_tergm_result": "${{ needs.temporal-tergm.result }}",
            "generated_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      - name: Upload manifest artifact
        uses: actions/upload-artifact@v4
        with:
          name: network-model-results-manifest-${{ env.RUN_ID }}
          path: artifacts/
          retention-days: 30
