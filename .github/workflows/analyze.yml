name: ERGM and TERGM Analysis

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "D1 model_runs ID"
        required: true
        default: "1"
      analysis_mode:
        description: "ergm, tergm, or both"
        required: true
        type: choice
        options:
          - both
          - ergm
          - tergm
        default: both
  repository_dispatch:
    types: [run-ergm]

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      RUN_ID: ${{ github.event.client_payload.run_id || inputs.run_id }}
      ANALYSIS_MODE: ${{ github.event.client_payload.analysis_mode || inputs.analysis_mode || 'both' }}
      API_BASE_URL: ${{ secrets.API_BASE_URL }}
      ANALYSIS_API_TOKEN: ${{ secrets.ANALYSIS_API_TOKEN }}
    steps:
      - name: Report GitHub run ID to API
        shell: bash
        run: |
          curl -sf -X POST "$API_BASE_URL/api/model-github-run" \
            -H "Authorization: Bearer $ANALYSIS_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"run_id\":\"$RUN_ID\",\"github_run_id\":\"${{ github.run_id }}\",\"github_run_url\":\"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            || echo "::warning::GitHub run ID를 API에 보고하지 못했습니다(계속 진행)."

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install and cache R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::jsonlite
            any::httr2
            any::network
            any::ergm
            any::sna
            any::tergm
            any::networkDynamic
            any::tsna
            any::btergm
            any::coda
            any::texreg
            any::igraph
          cache-version: 14

      - name: Validate configuration
        shell: bash
        run: |
          test -n "$RUN_ID" || (echo "RUN_ID is missing" && exit 1)
          test -n "$API_BASE_URL" || (echo "API_BASE_URL secret is missing" && exit 1)
          test -n "$ANALYSIS_API_TOKEN" || (echo "ANALYSIS_API_TOKEN secret is missing" && exit 1)
          echo "Run ID: $RUN_ID"
          echo "Analysis mode: $ANALYSIS_MODE"

      - name: Run static ERGM
        if: env.ANALYSIS_MODE == 'ergm' || env.ANALYSIS_MODE == 'both'
        run: Rscript r-analysis/run_ergm.R "$RUN_ID"

      - name: Run temporal ERGM
        if: env.ANALYSIS_MODE == 'tergm' || env.ANALYSIS_MODE == 'both'
        continue-on-error: true
        run: Rscript r-analysis/run_tergm.R "$RUN_ID"

      - name: Write workflow manifest
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts
          cat > artifacts/workflow-manifest.json <<EOF
          {
            "run_id": "$RUN_ID",
            "analysis_mode": "$ANALYSIS_MODE",
            "repository": "${{ github.repository }}",
            "commit": "${{ github.sha }}",
            "workflow_run": "${{ github.run_id }}",
            "generated_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      - name: Upload analysis artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: network-model-results-${{ env.RUN_ID }}
          path: artifacts/
          retention-days: 30
